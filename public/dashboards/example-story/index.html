<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Placeholder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #faf8f5;
      color: #1c1917;
      padding: 24px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .placeholder {
      text-align: center;
      max-width: 400px;
    }
    h2 { font-size: 20px; margin-bottom: 12px; color: #0d9488; }
    p { font-size: 14px; color: #78716c; line-height: 1.6; }
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 200px;
      margin: 24px auto;
      padding: 0 20px;
    }
    .bar {
      flex: 1;
      background: #0d9488;
      border-radius: 4px 4px 0 0;
      transition: opacity 0.2s;
      cursor: pointer;
    }
    .bar:hover { opacity: 0.7; }
  </style>
</head>
<body>
  <div class="placeholder">
    <div class="bars">
      <div class="bar" style="height: 65%"></div>
      <div class="bar" style="height: 45%; opacity: 0.8"></div>
      <div class="bar" style="height: 80%; opacity: 0.9"></div>
      <div class="bar" style="height: 35%; opacity: 0.7"></div>
      <div class="bar" style="height: 90%"></div>
      <div class="bar" style="height: 55%; opacity: 0.8"></div>
      <div class="bar" style="height: 70%; opacity: 0.9"></div>
      <div class="bar" style="height: 40%; opacity: 0.7"></div>
    </div>
    <h2>Interactive Dashboard</h2>
    <p>This is a placeholder dashboard. Replace with your real data visualisation.</p>
  </div>
</body>
</html>
